<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Qora · Study</title>
<meta name="theme-color" content="#e8e8e8" />
<style>
  @font-face{font-family:PSTimes;src:url("./assets/fonts/PSTimes.woff2") format("woff2");font-display:swap}
  @font-face{font-family:HelveticaNeueRegular;src:url("./assets/fonts/HelveticaNeue.woff2") format("woff2");font-display:swap}
  :root{--bg:#e8e8e8;--ink:#030303}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:HelveticaNeueRegular,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;touch-action:none}
  #webgl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;opacity:0}

  /* LOADER — IG */
  .introLoader{position:fixed;inset:0;z-index:1010;color:#030303}
  .introLoader.is-done{pointer-events:none;visibility:hidden}
  .introLoader__bg{position:absolute;inset:0;background:#e8e8e8}
  .introLoader__wrapper{position:relative;z-index:2;height:100%;max-width:2088px;margin:0 auto;padding:0 16px;
    display:grid;grid-template-columns:repeat(12,1fr);column-gap:16px;align-items:center}
  .introLoader__logo{grid-column:2/4}
  .introLoader__logo svg{display:block;width:76%;min-width:160px;opacity:0}
  .introLoader__progressWrapper{grid-column:4/10;position:relative;font-family:PSTimes,serif;
    font-size:clamp(28px,1.944vw,37px);line-height:1.2}
  .introLoader__progressBar{position:absolute;top:.5em;left:0;width:100%;height:100%;display:flex;opacity:.2}
  .introLoader__progressBar>div{width:100%;height:1px;background:currentColor;transform:scaleX(0);transform-origin:0 0}
  .introLoader__baseline{display:flex;flex-wrap:wrap;gap:.33em;margin-top:-.2em}
  .introLoader__baseline>div{opacity:0}
  .introLoader__scrollDown{grid-column:10/13;font-size:14px;opacity:0}
  .introLoader__scrollDown .num{opacity:.6;font-variant-numeric:tabular-nums}
  @media(max-width:1024px){
    .introLoader__logo{grid-column:1/5}
    .introLoader__progressWrapper,.introLoader__scrollDown{grid-column:1/12}
  }

  .chrome{position:fixed;inset:0;z-index:10;pointer-events:none;opacity:0}
  .chrome.is-on{opacity:1}
  .nav-top{position:absolute;top:clamp(20px,3vw,40px);right:clamp(24px,4vw,56px);pointer-events:auto}
  .nav-top button,.sound{background:none;border:0;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
  .sound{position:absolute;left:clamp(24px,4vw,56px);top:clamp(20px,3vw,40px);pointer-events:auto;
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(3,3,3,.45)}
  .sound.is-on{color:var(--ink)}
  .credit{position:absolute;right:clamp(24px,4vw,56px);top:clamp(22px,3vw,42px);font-size:11px;color:rgba(3,3,3,.4)}
  .midline{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
    display:flex;align-items:center;justify-content:space-between;padding:0 clamp(24px,4vw,56px);gap:20px}
  .mid-logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;pointer-events:auto;min-width:150px}
  .mid-logo svg{width:28px;height:28px}
  .mid-logo span{font-size:11px;letter-spacing:.28em;text-transform:uppercase}
  .mid-title{flex:1;text-align:center;font-family:PSTimes,serif;font-size:clamp(22px,1.944vw,37px);transition:opacity .55s,transform .55s}
  .mid-title.is-dim{opacity:0;transform:translateY(-10px)}
  .mid-scroll{min-width:150px;text-align:right;font-size:14px;opacity:.85;transition:opacity .4s}
  .mid-scroll.is-hide{opacity:0}
  .panel{position:absolute;left:clamp(24px,4vw,56px);bottom:clamp(88px,14vh,150px);max-width:min(420px,86vw);
    opacity:0;transform:translateY(16px);transition:opacity .55s,transform .55s;pointer-events:none}
  .panel.is-on{opacity:1;transform:translateY(0)}
  .panel h2{font-family:PSTimes,serif;font-size:clamp(28px,3.6vw,40px);font-weight:400;line-height:1.05;margin-bottom:10px}
  .panel p{font-size:14px;line-height:1.55;color:rgba(3,3,3,.7);max-width:34ch}
  .bot-left{position:absolute;left:clamp(24px,4vw,56px);bottom:clamp(20px,3vw,40px);pointer-events:auto}
  .bot-left a{font-size:13px;color:inherit;text-decoration:none}
  .bot-right{position:absolute;right:clamp(24px,4vw,56px);bottom:clamp(24px,3vw,44px)}
  .dot{width:5px;height:5px;border-radius:50%;background:#030303;margin-left:auto}
  .rail{width:1px;height:72px;background:rgba(3,3,3,.12);position:relative;margin-bottom:14px;margin-left:auto}
  .rail>i{position:absolute;top:0;left:0;width:100%;height:0%;background:#030303}
  .hint{position:fixed;left:50%;bottom:48px;transform:translateX(-50%);z-index:12;
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(3,3,3,.35);
    pointer-events:none;transition:opacity .6s}
  .hint.is-hide{opacity:0}
  .menu-sheet{position:fixed;inset:0;z-index:40;background:rgba(232,232,232,.97);
    display:grid;place-items:center;opacity:0;visibility:hidden;transition:.35s;pointer-events:none}
  .menu-sheet.is-open{opacity:1;visibility:visible;pointer-events:auto}
  .menu-sheet a,.menu-sheet button{font-family:PSTimes,serif;font-size:clamp(28px,5vw,44px);
    color:inherit;background:none;border:0;text-decoration:none;cursor:pointer;display:block;margin:16px auto}
  .menu-close{position:absolute!important;top:28px;right:40px;font-family:HelveticaNeueRegular,sans-serif!important;font-size:13px!important}
</style>
</head>
<body>
  <div class="introLoader" id="loader">
    <div class="introLoader__bg" id="loaderBg"></div>
    <div class="introLoader__wrapper">
      <div class="introLoader__logo" id="loaderLogo">
        <svg viewBox="0 0 180 36" fill="none">
          <defs><mask id="logoMask"><rect id="logoMaskRect" x="-118" y="0" width="180" height="36" fill="#fff"/></mask></defs>
          <g mask="url(#logoMask)">
            <path d="M14 2.5 L26 8.5 V20.5 L14 31.5 L2 20.5 V8.5 Z" stroke="#030303" stroke-width="1.15" fill="none"/>
            <path d="M9.2 22.2 V12.8 H13.4 C15.55 12.8 16.85 13.95 16.85 15.85 C16.85 17.7 15.55 18.85 13.4 18.85 H11.2 V22.2 H9.2 Z M11.2 17.2 H13.25 C14.35 17.2 14.85 16.75 14.85 15.85 C14.85 14.95 14.35 14.5 13.25 14.5 H11.2 V17.2 Z" fill="#030303"/>
            <text x="34" y="22.5" fill="#030303" font-family="Helvetica,Arial,sans-serif" font-size="11" letter-spacing="3.2">QORA</text>
          </g>
        </svg>
      </div>
      <div class="introLoader__progressWrapper">
        <div class="introLoader__progressBar"><div id="progressLine"></div></div>

  <canvas id="webgl"></canvas>
  <div class="hint" id="moveHint">Move your cursor</div>

  <div class="chrome" id="chrome">
    <button class="sound" id="soundBtn" type="button">Sound off</button>
    <div class="credit">Study · for Vadim</div>
    <div class="nav-top"><button type="button" id="menuBtn">Menu</button></div>
    <div class="midline">
      <a class="mid-logo" href="https://qora.group" target="_blank" rel="noopener">
        <svg viewBox="0 0 32 32" fill="none"><path d="M16 2.5 L27 8.2 V19.5 L16 29.5 L5 19.5 V8.2 Z" stroke="#030303" stroke-width="1.2"/><path d="M11.5 20 V12.5 H15.2 C17.1 12.5 18.2 13.5 18.2 15.1 C18.2 16.7 17.1 17.7 15.2 17.7 H13.2 V20 H11.5 Z M13.2 16.3 H15 C16 16.3 16.5 15.9 16.5 15.1 C16.5 14.3 16 13.9 15 13.9 H13.2 V16.3 Z" fill="#030303"/></svg>
        <span>Qora</span>
      </a>

      <div class="mid-scroll" id="midScroll">Scroll down</div>
    </div>
    <div class="panel" id="panel">
      <h2 id="panelTitle">Relief from the plane</h2>
      <p id="panelText">Scroll moves the carved field into view. Mouse keeps a soft local wave — like Immersive Garden.</p>
    </div>
    <div class="bot-left"><a href="https://qora.group" target="_blank" rel="noopener">See the approach →</a></div>
    <div class="bot-right"><div class="rail"><i id="rail"></i></div><div class="dot"></div></div>

  <div class="menu-sheet" id="menu">

    <div>
      <button type="button" data-jump="0">Home</button>
      <a href="https://qora.group" target="_blank" rel="noopener">qora.group</a>
      <a href="https://t.me/pavel_xdev" target="_blank" rel="noopener">@pavel_xdev</a>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>
<script type="module">
/**
 * Immersive Garden core: hidden image revealed by mouse FLUID WAVES
 * (fluidFlowmap: density + velocity splat → distort + reveal)
 */
import * as THREE from 'three';

const $ = (id) => document.getElementById(id);
const loader = $('loader');
const progressLine = $('progressLine');
const loadPct = $('loadPct');
const baselineWords = [...document.querySelectorAll('#baseline > div')];
const scrollDown = $('scrollDown');
const logoMaskRect = $('logoMaskRect');
const loaderLogo = $('loaderLogo');
const loaderBg = $('loaderBg');
const chrome = $('chrome');
const webglEl = $('webgl');
const moveHint = $('moveHint');
const rail = $('rail');
const midScroll = $('midScroll');
const soundBtn = $('soundBtn');
const menu = $('menu');
const midTitle = $('midTitle');
const panel = $('panel');
const panelTitle = $('panelTitle');
const panelText = $('panelText');

const chapters = [
  { at: 0.08, title: 'Relief from the plane', text: 'The carved surface rises into the field as you scroll — presence first, like Immersive Garden.' },
  { at: 0.38, title: 'Atmosphere as product', text: 'Not a gallery of slides. A space the client enters with the wheel and the cursor.' },
  { at: 0.68, title: 'Your object next', text: 'Facade, interior, Kizhi, Fallingwater — same format on your frames. Pavel Galanté · Qora.' },
];

// ——— sound ———
let soundOn = false;
const music = new Howl({
  src: ['./assets/sounds/ambient_loop.mp3'],
  loop: true,
  volume: 0,
  preload: true,
  html5: true,
});
const tick = new Howl({ src: ['./assets/sounds/click.mp3'], volume: 0.15, preload: true });
function enableSound() {
  if (soundOn) return;
  soundOn = true;
  soundBtn.textContent = 'Sound on';
  soundBtn.classList.add('is-on');
  try { Howler.ctx?.resume?.(); } catch (_) {}
  if (!music.playing()) music.play();
  music.fade(0, 0.16, 1800); // quiet, not a buzz
}
soundBtn.onclick = (e) => {
  e.stopPropagation();
  if (!soundOn) { tick.play(); enableSound(); }
  else {
    tick.play();
    soundOn = false; soundBtn.textContent = 'Sound off'; soundBtn.classList.remove('is-on');
    music.fade(music.volume(), 0, 500); setTimeout(() => !soundOn && music.pause(), 520);
  }
};

// ——— LOADER ———
const loadState = { p: 0 };
let assetProgress = 0;
let outroStarted = false;
const MIN_LOAD_MS = 3200;
const t0 = performance.now();

function playIntroIn() {
  const tl = gsap.timeline();
  gsap.set(loaderLogo.querySelector('svg'), { opacity: 1 });
  tl.fromTo(logoMaskRect, { attr: { x: -118 } }, { attr: { x: 0 }, duration: 2.5, ease: 'quart.out' }, 0);
  tl.fromTo(baselineWords, { opacity: 0 }, { opacity: 1, duration: 1, ease: 'sine.inOut', stagger: 0.1 }, 0.3);
  tl.fromTo(scrollDown, { opacity: 0 }, { opacity: 1, duration: 0.8, ease: 'sine.inOut' }, 0.35);
}
function playIntroOut() {
  const tl = gsap.timeline({
    onComplete: () => { loader.classList.add('is-done'); },
  });
  tl.add(() => { loadPct.textContent = 'Scroll down'; loadPct.style.opacity = '1'; }, 0);
  tl.to(progressLine.parentElement, { opacity: 0, duration: 1.2, ease: 'sine.inOut' }, 0);
  tl.to(baselineWords, { opacity: 0, duration: 1, ease: 'sine.inOut', stagger: -0.1 }, 0.15);
  tl.to(logoMaskRect, { attr: { x: -118 }, duration: 2, ease: 'quart.inOut' }, 0);
  tl.to(loaderLogo, { opacity: 0, duration: 0.5, ease: 'sine.inOut' }, 1.9);
  tl.to(scrollDown, { opacity: 0, duration: 0.8, ease: 'sine.inOut' }, 1.9);
  tl.to(loaderBg, { opacity: 0, duration: 1.2, ease: 'sine.inOut' }, 2.0);
  tl.to(webglEl, { opacity: 1, duration: 1.15, ease: 'sine.inOut' }, 2.05);
  tl.add(() => {
    chrome.classList.add('is-on');
    gsap.fromTo(chrome, { opacity: 0 }, { opacity: 1, duration: 0.9, ease: 'sine.inOut' });
  }, 2.2);
}
function tickLoader() {
  const elapsed = performance.now() - t0;
  const timeP = Math.min(1, elapsed / MIN_LOAD_MS);
  const ready = assetProgress >= 1 && elapsed >= MIN_LOAD_MS;
  const goal = ready ? 1 : Math.min(0.97, Math.max(assetProgress * 0.95, timeP * 0.9));
  loadState.p += (goal - loadState.p) * (ready ? 0.14 : 0.06);
  if (ready && loadState.p > 0.995) loadState.p = 1;
  gsap.set(progressLine, { scaleX: loadState.p });
  if (loadPct.textContent !== 'Scroll down') loadPct.textContent = String(Math.round(loadState.p * 100));
  if (loadState.p < 1) requestAnimationFrame(tickLoader);
  else if (!outroStarted) {
    outroStarted = true;
    gsap.set(progressLine, { scaleX: 1 });
    loadPct.textContent = '100';
    gsap.delayedCall(0.5, playIntroOut);
  }
}
playIntroIn();
requestAnimationFrame(tickLoader);

// ——— THREE + FLUID FLOWMAP ———
const canvas = $('webgl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setClearColor(0xe8e8e8, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const loaderTex = new THREE.TextureLoader();
const A = (p) => new URL(`./assets/${p}`, import.meta.url).href;
const [plasterMap, reliefMap, depthMap] = await Promise.all([
  loaderTex.loadAsync(A('tex/plaster.jpg')),
  loaderTex.loadAsync(A('tex/relief.jpg')),
  loaderTex.loadAsync(A('tex/relief_depth.png')),
]);
assetProgress = 1;
plasterMap.colorSpace = THREE.SRGBColorSpace;
reliefMap.colorSpace = THREE.SRGBColorSpace;
plasterMap.wrapS = plasterMap.wrapT = THREE.RepeatWrapping;
plasterMap.repeat.set(2.2, 2.2);
for (const t of [reliefMap, depthMap]) {
  t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
  t.minFilter = THREE.LinearFilter;
}

// --- fluid ping-pong ---
const simRes = 256;
function makeRT() {
  const params = {
    minFilter: THREE.LinearFilter,
    magFilter: THREE.LinearFilter,
    depthBuffer: false,
    type: THREE.UnsignedByteType,
    format: THREE.RGBAFormat,
  };
  // prefer float if available for smoother waves
  try {
    const gl = renderer.getContext();
    if (gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float')) {
      params.type = THREE.HalfFloatType;
    }
  } catch (_) {}
  return new THREE.WebGLRenderTarget(simRes, simRes, params);
}
let densityA = makeRT(), densityB = makeRT();
let velA = makeRT(), velB = makeRT();

const quad = new THREE.PlaneGeometry(2, 2);
const simScene = new THREE.Scene();
const simCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const simMesh = new THREE.Mesh(quad, new THREE.MeshBasicMaterial());
simScene.add(simMesh);

const splatMat = new THREE.ShaderMaterial({
  uniforms: {
    uTarget: { value: null },
    uPoint: { value: new THREE.Vector2(0.5, 0.5) },
    uPrev: { value: new THREE.Vector2(0.5, 0.5) },
    uColor: { value: new THREE.Vector3(1, 0, 0) },
    uRadius: { value: 0.035 },
    uAspect: { value: 1 },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader: `
    precision highp float;
    uniform sampler2D uTarget;
    uniform vec2 uPoint, uPrev;
    uniform vec3 uColor;
    uniform float uRadius, uAspect;
    varying vec2 vUv;
    float splat(vec2 uv, vec2 p, float r){
      vec2 d = uv - p; d.x *= uAspect;
      // tighter falloff — IG: small local brush, not full-screen fog
      return exp(-dot(d,d) / max(r * r, 1e-6));
    }
    void main(){
      vec4 base = texture2D(uTarget, vUv);
      float r = uRadius;
      float s = splat(vUv, uPoint, r);
      vec2 pa = vUv - uPrev; vec2 ba = uPoint - uPrev;
      float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-5), 0., 1.);
      vec2 d = pa - ba * h; d.x *= uAspect;
      s = max(s, exp(-dot(d,d) / max(r * r * 0.9, 1e-6)));
      // clamp add so trails never flood the buffer
      vec3 add = uColor * s;
      gl_FragColor = vec4(min(base.rgb + add, vec3(1.0)), 1.0);
    }
  `,
});

const fadeMat = new THREE.ShaderMaterial({
  uniforms: {
    uTex: { value: null },
    uDissipation: { value: 0.987 },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader: `
    precision highp float;
    uniform sampler2D uTex;
    uniform float uDissipation;
    varying vec2 vUv;
    void main(){
      gl_FragColor = texture2D(uTex, vUv) * uDissipation;
    }
  `,
});

const advectMat = new THREE.ShaderMaterial({
  uniforms: {
    uVelocity: { value: null },
    uSource: { value: null },
    uDissipation: { value: 0.98 },
    uDt: { value: 0.016 },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader: `
    precision highp float;
    uniform sampler2D uVelocity, uSource;
    uniform float uDissipation, uDt;
    varying vec2 vUv;
    void main(){
      vec2 vel = texture2D(uVelocity, vUv).xy;
      vec2 uv = vUv - vel * uDt;
      gl_FragColor = texture2D(uSource, uv) * uDissipation;
    }
  `,
});

// Final display: paper + scroll-driven relief band + local mouse waves
const viewUniforms = {
  uPlaster: { value: plasterMap },
  uImage: { value: reliefMap },
  uDepth: { value: depthMap },
  uDensity: { value: null },
  uVelocity: { value: null },
  uMouse: { value: new THREE.Vector2(0.5, 0.5) },
  uScroll: { value: 0 },
  uReveal: { value: 0 },
  uTime: { value: 0 },
  uRes: { value: new THREE.Vector2(1, 1) },
  uWave: { value: 0.012 },
};
const viewMat = new THREE.ShaderMaterial({
  uniforms: viewUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader: `
    precision highp float;
    uniform sampler2D uPlaster, uImage, uDepth, uDensity, uVelocity;
    uniform vec2 uMouse, uRes;
    uniform float uScroll, uReveal, uTime, uWave;
    varying vec2 vUv;

    void main(){
      vec2 puv = vUv * vec2(uRes.x/uRes.y, 1.0) * 1.5;
      puv.y += uScroll * 0.08; // paper rides with scroll (IG wall)
      vec3 plaster = texture2D(uPlaster, puv).rgb;
      plaster = mix(plaster, vec3(0.91), 0.48);

      float dens = texture2D(uDensity, vUv).r;
      vec2 vel = texture2D(uVelocity, vUv).xy;

      // mouse wave — soft local brush, a bit bigger than pin-head
      vec2 md = vUv - uMouse;
      md.x *= uRes.x / uRes.y;
      float cursor = exp(-dot(md, md) / 0.034);
      float energy = dens * mix(0.35, 1.0, cursor);
      float waveMask = smoothstep(0.04, 0.38, energy);
      waveMask = pow(waveMask, 1.15);

      vec2 warp = vel * uWave * waveMask;

      // --- SCROLL: relief band rises into view (IG) ---
      float bandY = mix(1.22, 0.38, clamp(uScroll * 1.15, 0.0, 1.0));
      float bandH = mix(0.0, 0.44, smoothstep(0.01, 0.5, uScroll));
      float inBand = 1.0 - smoothstep(bandH, bandH + 0.1, abs(vUv.y - bandY));
      inBand *= smoothstep(0.0, 0.08, uScroll);

      vec2 iuv = vUv;
      float aspect = uRes.x / uRes.y;
      float imgAspect = 16.0/9.0;
      if (aspect > imgAspect) iuv.y = (iuv.y - 0.5) * (imgAspect / aspect) + 0.5;
      else iuv.x = (iuv.x - 0.5) * (aspect / imgAspect) + 0.5;
      // map band to image content
      iuv.y = clamp((vUv.y - (bandY - bandH)) / max(bandH * 2.2, 0.001), 0.0, 1.0);
      iuv.y = mix(0.15, 0.9, iuv.y);
      iuv.x = clamp((iuv.x - 0.5) / mix(1.15, 1.0, uScroll) + 0.5, 0.001, 0.999);
      iuv = clamp(iuv + warp * 0.35, 0.001, 0.999);

      vec3 img = texture2D(uImage, iuv).rgb;
      float g = dot(img, vec3(0.299, 0.587, 0.114));
      img = mix(img, vec3(g), 0.35);
      img = mix(img, plaster, 0.18);

      float dL = texture2D(uDepth, clamp(iuv+vec2(-0.002,0.),0.,1.)).r;
      float dR = texture2D(uDepth, clamp(iuv+vec2( 0.002,0.),0.,1.)).r;
      float dD = texture2D(uDepth, clamp(iuv+vec2(0.,-0.002),0.,1.)).r;
      float dU = texture2D(uDepth, clamp(iuv+vec2(0., 0.002),0.,1.)).r;
      vec3 N = normalize(vec3(dL-dR, dD-dU, 0.42));
      vec3 L = normalize(vec3((uMouse.x-0.5)*0.9, (uMouse.y-0.5)*0.9, 1.0));
      img *= 0.58 + clamp(dot(N, L), 0., 1.) * 0.45;

      // paper with local mouse refraction
      vec3 paper = texture2D(uPlaster, puv + warp).rgb;
      paper = mix(paper, vec3(0.91), 0.48);
      vec3 col = mix(plaster, paper, waveMask * 0.65);

      // scroll reveals carved band into the field
      float reveal = inBand * uReveal;
      col = mix(col, img, reveal);

      // tiny extra peek where mouse waves over the relief
      col = mix(col, img, waveMask * reveal * 0.25);

      gl_FragColor = vec4(col, 1.0);
    }
  `,
});
const viewMesh = new THREE.Mesh(quad, viewMat);
scene.add(viewMesh);

function fit() {
  const w = innerWidth, h = innerHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(w, h, false);
  viewUniforms.uRes.value.set(w, h);
  splatMat.uniforms.uAspect.value = w / h;
}
addEventListener('resize', fit);
fit();

// mouse → fluid
const mouse = new THREE.Vector2(0.5, 0.5);
const prevMouse = new THREE.Vector2(0.5, 0.5);
const mouseSmooth = new THREE.Vector2(0.5, 0.5);
let hasMoved = false;

function setMouse(e) {
  prevMouse.copy(mouse);
  mouse.set(e.clientX / innerWidth, 1 - e.clientY / innerHeight);
  if (!hasMoved) {
    hasMoved = true;
    moveHint.classList.add('is-hide');
  }
}
window.addEventListener('pointermove', setMouse);
window.addEventListener('pointerdown', (e) => { setMouse(e); });

let targetScroll = 0, scrollP = 0;
let chapterIdx = -1;
function applyChapter(p) {
  let idx = -1;
  for (let i = 0; i < chapters.length; i++) {
    if (p >= chapters[i].at) idx = i;
  }
  if (idx === chapterIdx) return;
  chapterIdx = idx;
  if (idx < 0) {
    panel.classList.remove('is-on');
    midTitle.classList.remove('is-dim');
    return;
  }
  midTitle.classList.add('is-dim');
  panelTitle.textContent = chapters[idx].title;
  panelText.textContent = chapters[idx].text;
  panel.classList.add('is-on');
}
window.addEventListener('wheel', (e) => {
  e.preventDefault();
  // IG-feel: wheel moves the field quickly into the relief
  const step = Math.abs(e.deltaY) > 40 ? e.deltaY * 0.00135 : e.deltaY * 0.0011;
  targetScroll = THREE.MathUtils.clamp(targetScroll + step, 0, 1);
}, { passive: false });

// touch / trackpad drag as scroll (phones + IG-like pan)
let touchY = null;
window.addEventListener('touchstart', (e) => {
  touchY = e.touches[0].clientY;
}, { passive: true });
window.addEventListener('touchmove', (e) => {
  if (touchY == null) return;
  e.preventDefault();
  const y = e.touches[0].clientY;
  targetScroll = THREE.MathUtils.clamp(targetScroll + (touchY - y) * 0.0022, 0, 1);
  touchY = y;
}, { passive: false });
window.addEventListener('touchend', () => { touchY = null; });

$('menuBtn').onclick = () => { tick.play(); menu.classList.add('is-open'); };
$('menuClose').onclick = () => { tick.play(); menu.classList.remove('is-open'); };
menu.querySelectorAll('[data-jump]').forEach((b) => b.onclick = () => {
  tick.play(); targetScroll = +b.dataset.jump; menu.classList.remove('is-open');
});

function runPass(mat, inputRT, outputRT, update) {
  simMesh.material = mat;
  update && update();
  renderer.setRenderTarget(outputRT);
  renderer.render(simScene, simCam);
  renderer.setRenderTarget(null);
}

const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.033);
  const t = clock.elapsedTime;

  mouseSmooth.lerp(mouse, 1 - Math.exp(-dt * 8));
  scrollP += (targetScroll - scrollP) * (1 - Math.exp(-dt * 3.2));

  // IG brush: local, a bit larger than pin-head, soft trail
  const force = new THREE.Vector2().subVectors(mouse, prevMouse);
  const speed = Math.min(force.length() * 48.0, 0.95);

  runPass(fadeMat, velA, velB, () => {
    fadeMat.uniforms.uTex.value = velA.texture;
    fadeMat.uniforms.uDissipation.value = 0.905;
  });
  [velA, velB] = [velB, velA];

  if (speed > 0.0015) {
    runPass(splatMat, velA, velB, () => {
      splatMat.uniforms.uTarget.value = velA.texture;
      splatMat.uniforms.uPoint.value.copy(mouse);
      splatMat.uniforms.uPrev.value.copy(prevMouse);
      splatMat.uniforms.uColor.value.set(force.x * 1.35, force.y * 1.35, 0);
      splatMat.uniforms.uRadius.value = 0.014; // slightly bigger IG brush
    });
    [velA, velB] = [velB, velA];
  }

  runPass(fadeMat, densityA, densityB, () => {
    fadeMat.uniforms.uTex.value = densityA.texture;
    fadeMat.uniforms.uDissipation.value = 0.925;
  });
  [densityA, densityB] = [densityB, densityA];

  runPass(advectMat, densityA, densityB, () => {
    advectMat.uniforms.uVelocity.value = velA.texture;
    advectMat.uniforms.uSource.value = densityA.texture;
    advectMat.uniforms.uDissipation.value = 0.94;
    advectMat.uniforms.uDt.value = dt * 0.16;
  });
  [densityA, densityB] = [densityB, densityA];

  if (speed > 0.0015) {
    runPass(splatMat, densityA, densityB, () => {
      splatMat.uniforms.uTarget.value = densityA.texture;
      splatMat.uniforms.uPoint.value.copy(mouse);
      splatMat.uniforms.uPrev.value.copy(prevMouse);
      splatMat.uniforms.uColor.value.set(0.55, 0, 0);
      splatMat.uniforms.uRadius.value = 0.016;
    });
    [densityA, densityB] = [densityB, densityA];
  }

  prevMouse.copy(mouse);

  // scroll → relief enters (0 at home, full by ~mid scroll)
  const reveal = THREE.MathUtils.smoothstep(scrollP, 0.02, 0.42);

  viewUniforms.uDensity.value = densityA.texture;
  viewUniforms.uVelocity.value = velA.texture;
  viewUniforms.uMouse.value.copy(mouseSmooth);
  viewUniforms.uScroll.value = scrollP;
  viewUniforms.uReveal.value = reveal;
  viewUniforms.uTime.value = t;
  viewUniforms.uWave.value = 0.016; // soft local refraction, a bit stronger

  rail.style.height = `${(scrollP * 100).toFixed(1)}%`;
  midScroll.classList.toggle('is-hide', scrollP > 0.04);
  applyChapter(scrollP);

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
